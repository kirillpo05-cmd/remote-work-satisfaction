# One-command startup: `docker compose up` serves the API on :8000 and the UI
# on :8501. No environment variable is required. The precomputed artifacts are
# baked into the image (D-013), so the API becomes healthy in seconds — the
# only one-time cost is the image build. No volume is mounted: the artifacts
# are read straight from the image, and the entrypoint's regenerate-if-absent
# fallback (SPEC M7) still applies if the baked files are ever removed.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s  # artifacts are baked in; measured healthy in ~4s

  ui:
    build: .
    command:
      - streamlit
      - run
      - app/main.py
      - --server.port=8501
      - --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      RWSAT_API_URL: http://api:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      api:
        condition: service_healthy
