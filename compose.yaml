# One-command startup: `docker compose up` serves the API on :8000 and the UI
# on :8501. No environment variable is required. On a cold start the API
# produces the missing artifacts first (signal report + model); measured cold
# start on the development machine: 62 minutes from `up` to a working UI.
# The UI waits on the API healthcheck and appears when the API is ready.
# Artifacts persist in the named volume, so every later start takes seconds.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Named volume, not a host bind mount: on a Linux host Docker would
      # create ./artifacts root-owned before the non-root container starts,
      # and first-start training would die on Permission denied. The named
      # volume initialises from the image's rwsat-owned /app/artifacts and
      # works identically on every platform.
      - artifacts:/app/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120m  # measured cold start is ~62 min; margin for slower hosts

  ui:
    build: .
    command:
      - streamlit
      - run
      - app/main.py
      - --server.port=8501
      - --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      RWSAT_API_URL: http://api:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      api:
        condition: service_healthy

volumes:
  artifacts:
